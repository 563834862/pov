# 验证引擎权重（满分 100）
verify:
  weights:
    heat: 45      # 热度契合：报道覆盖广度 + 互动量归一
    timing: 25    # 时效契合：事件传播阶段（发酵期最佳）
    volume: 10    # 声量参照：博主互动量 vs 事件均量
    diff: 20      # 差异化：热点饱和度（过饱和扣分，独苗给中等分）

# 重复舆情判重（采集即去重：完全重复不入库，来源并入保留条目的 sources）
dedup:
  enabled: true
  similarity: 0.30       # IDF 余弦阈值，≥ 此值且时间接近 → 判为同一件事
  time_window_hours: 72  # 判定同一件事允许的最大发布间隔
  min_shared_terms: 4    # 兜底：共享显著性实体词最少数（门槛高于 similarity）
  near_dup_merge: false  # true=同源报道直接合并为一条；false=保留为同一事件的多条报道

# 英文标题翻译（海外源→中文；凭证从 ~/.workbuddy/models.json 的 StepFun 条目读取）
translate:
  enabled: true
  batch_size: 10
  timeout: 45

# 自动调度（看板内嵌线程 / pov.py schedule / Windows 计划任务共用；文件锁防重入）
schedule:
  enabled: true               # false = 全手动（点看板按钮或跑 CLI）
  collect_interval_hours: 6   # 舆情基线采集周期（26 源全量，约 1-2 分钟）
  verify_interval_hours: 2    # 博主验证周期（每次采集后 1 分钟自动触发一次验证）
  run_on_start: true          # 看板/调度启动后先立即跑一轮
  start_delay_seconds: 30     # 启动延迟（避开开机网络未就绪、看板先起来）

web:
  host: 127.0.0.1
  # 8765 已被本机其他服务（uvicorn）占用，故 POV 默认改用 8766；
  # 如需临时换端口：python pov.py serve --port=8899
  port: 8766
