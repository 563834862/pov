# 舆情验证系统（POV - Public Opinion Verification）配置
# 核心流程：采集领域舆情基线 → 监控博主新内容 → 选题与舆情比对 → 输出验证结论

system:
  name: 舆情验证系统
  version: 0.5.0

# 舆情基线关键词（博主所在领域，决定抓什么热点作比对）
# 范围 = AI 全领域 + 科技前沿热点（马斯克/特斯拉等用户关注面）
keywords:
  - AI工具
  - AIGC
  - AI视频生成
  - AI短剧
  - AI变现
  - AI创业
  - 大模型
  - 智能体
  - AI行业动态
  - 科技热点

baseline:
  range: 7d            # 舆情时间窗：24h / 7d / 30d
  top_n: 10            # 热点榜每榜条数
  # 采集源按《舆情与AI新闻采集来源总清单》分层登记（详见 core/source_registry.py）
  # 原则：官方 API > 原生 RSS > RSSHub > 爬虫；已关停源禁止登记（配置校验会告警）
  sources:
    # ---- 政策层（清单第一、二、三章；长周期热点）----
    - gov_policy       # 中国政府网 · 国务院政策文件库（无官方 API，容错解析）
    - federal_register # 美联邦公报 · 官方 API 免费无 key（规则/行政令/关税）
    - gdelt            # GDELT DOC 2.0 · 全球事件库 15 分钟更新，自带 tone 情绪分
    # ---- AI 一手信源（清单第四章；技术突破先于新闻稿，信噪比高地）----
    - arxiv            # arXiv 官方 API（cs.AI/CL/LG/CV/MA，限 1 请求/3 秒）
    - hf_papers        # HuggingFace 每日精选论文（含 upvotes/githubStars）
    - github_trending  # GitHub 趋势项目（Trending 页解析，Search API 兜底）
    # ---- 媒体 / 社区（清单第五章；原生 RSS 覆盖最全）----
    - qbitai           # 量子位（中文原生 RSS）
    - infoq            # InfoQ 中文（原生 RSS）
    - venturebeat_ai   # VentureBeat AI 专栏 RSS
    - techcrunch_ai    # TechCrunch AI 频道 RSS
    - theverge_ai      # The Verge AI 频道 RSS
    - arstechnica      # Ars Technica RSS
    - mittr            # MIT Technology Review RSS
    - openai_news      # OpenAI 官方新闻 RSS（剔除客户案例稿）
    - hackernews       # HackerNews 首页（Algolia API 直连）
    - producthunt      # ProductHunt 每日新品（Atom feed 直连）
    # ---- 国内舆情 / 热度榜（清单第七章；情绪与热度）----
    - search_engine    # 搜索引擎结果（由 Agent 喂入 data/inputs/ 或手工放入）
    - kr36             # 36氪搜索页
    - baidu_news       # 百度新闻
    - toutiao          # 今日头条搜索
    - bilibili_rank    # B站全站热榜（按标题过滤 AI 相关）
    - weibo_hot        # 微博热搜榜（★ 免费热度榜，需 Referer）
    - baidu_hot        # 百度热搜榜（★ 免费热度榜）
    - toutiao_hot      # 头条热榜（★ 免费热度榜，含 HotValue）
    # ---- 桥接喂入（被墙 / 强风控平台）----
    - x_search         # X 平台（域名被墙，由 Agent WebSearch 喂入 data/inputs/oversea-x-*.json）
    - youtube_search   # YouTube 平台（域名被墙，由 Agent WebSearch 喂入 data/inputs/oversea-yt-*.json）

# 各源的附加参数（留空则用模块内置默认值）
sources_extra:
  # arXiv：仅用于本地相关性过滤（关键词检索会触发 arXiv 限流），取 AI 分类最新提交
  arxiv_queries: ["AI video generation", "AI agent", "open weights model"]
  # 美联邦公报检索词
  fedreg_terms: ["artificial intelligence", "machine learning", "semiconductor"]
  # 中国政府网政策文件库检索词（按公文标题检索，需用公文口径的词）
  gov_terms: ["人工智能", "大模型", "生成式人工智能"]
  # GDELT 检索式
  gdelt_query: '("artificial intelligence" OR "generative AI" OR "AI model")'
  github_token: ""     # 可选：填 GitHub PAT 提高 Search API 额度

